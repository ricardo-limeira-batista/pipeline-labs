name: "Action com schedule"

on:
  schedule:
    # executa às 21:55 horário Brasília UTC0
    - cron: '12 21 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  scheduled-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para o git rev-list / shortlog funcionarem bem

      - name: Informações do Schedule
        run: |
          echo "Workflow disparado por SCHEDULE"
          echo "Data atual: $(date)"
          echo "Hora UTC: $(date -u)"
          echo "Timezone: $(date +%Z)"

      - name: Relatório diário automatizado
        run: |
          echo "RELATÓRIO DIÁRIO AUTOMATIZADO"
          echo "========================================="
          echo "Total de commits: $(git rev-list --all --count)"
          echo "Contribuidores únicos: $(git shortlog -sn | wc -l)"
          echo "Último commit: $(git log -n 1 --pretty=format:'%h - %s (%an, %ar)')"


